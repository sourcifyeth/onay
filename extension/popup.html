<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Onay</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body data-state="connecting">
    <header class="brand">
      <img src="icons/icon-32.png" alt="" width="20" height="20" />
      <span>Onay</span>
      <span class="dot"></span>
    </header>
    <main class="card">
      <h1 id="title">Connecting to the Onay app…</h1>
      <p id="code" class="code"></p>
      <p id="detail"></p>
      <p id="waiting" class="notice"></p>
    </main>
    <p class="hint">
      Onay shows you what a site asks your wallet to sign. It never holds keys and never changes a request.
    </p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
