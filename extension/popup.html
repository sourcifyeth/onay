<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Onay</title>
    <style>
      body {
        margin: 16px;
        min-width: 300px;
        font: 14px system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      p {
        margin: 8px 0 0;
      }
      #code {
        font: 600 32px ui-monospace, monospace;
        letter-spacing: 2px;
      }
      #code:empty,
      #waiting:empty,
      #detail:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1 id="title">Connecting to the Onay app...</h1>
    <p id="code"></p>
    <p id="detail"></p>
    <p id="waiting"></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
