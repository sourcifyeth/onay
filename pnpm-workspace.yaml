packages:
  - app
  - extension
  - mock
  - site

# supply-chain guardrails (see PLAN.md)
# cbor-extract is the native addon of cbor-x (from lib-sourcify). Not built:
# cbor-x falls back to JavaScript, as it does in the webview anyway.
allowBuilds:
  cbor-extract: false

minimumReleaseAge: 10080 # minutes = 7 days

# Sourcify's own clear-signing library: the newest release goes in as soon
# as it is published, without the seven-day wait.
minimumReleaseAgeExclude:
  - '@ethereum-sourcify/clear-signing'
