# Builds and publishes a release from a version tag on main, such as 0.1.0.
# The tag must equal the app version in the repo (scripts/set-version.mjs).
# The app is published only from here. The last job rebuilds the download
# page at onay.sh, so it lists the new release. The extension has its own
# tags and workflow (release-extension.yml). The signing secrets live in the
# `release` environment, which only version tags may use, and there is no
# manual trigger: no workflow on a branch can reach them.
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Tag on main, version in the repo
    runs-on: ubuntu-latest
    steps:
      # actions are pinned to commit SHAs (tag in the comment), per the supply-chain rules
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: The tag equals the version in the repo
        run: node scripts/set-version.mjs --check app "$GITHUB_REF_NAME"

  app:
    name: App on ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # one native runner per target: Linux x64, macOS arm64
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    # the secrets of the environment, released to version tags only
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # a registry cache of its own: the one of the CI workflow also holds a debug target/
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-release-${{ runner.os }}-${{ hashFiles('app/Cargo.lock', 'app/rust-toolchain.toml') }}
          restore-keys: cargo-release-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # The Rust compile runs before the secrets exist: no build script or
      # proc macro of the dependency tree sees them. The features are the
      # ones `tauri build` uses, so it compiles only the app crate again.
      # The app crate embeds the webview at compile time, so that is built first.
      - run: pnpm --filter app build
      - name: Compile the app and the relay
        working-directory: app
        run: cargo build --release --locked --bins -p onay -p onay-relay --features tauri/custom-protocol
      # macOS: with the six secrets, Tauri imports the Developer ID certificate
      # into a keychain of its own, signs, and notarizes. Without them the app
      # gets an ad-hoc signature (tauri.bundle.conf.json). Some of them is a
      # mistake, and empty variables would break the bundler.
      - name: Apple signing credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          names='APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_CONTENT'
          set_count=0
          for name in $names; do
            if [ -n "${!name}" ]; then set_count=$((set_count + 1)); fi
          done
          if [ "$set_count" -eq 0 ]; then
            echo "No APPLE_* secrets: ad-hoc signature, no notarization."
            exit 0
          fi
          if [ "$set_count" -ne 6 ]; then
            echo "::error::$set_count of the 6 APPLE_* secrets are set. Set all six, or none."
            exit 1
          fi
          echo "Developer ID signature and notarization."
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          # a random delimiter: a value cannot end its own heredoc
          delim="$(openssl rand -hex 16)"
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY; do
            printf '%s<<%s\n%s\n%s\n' "$name" "$delim" "${!name}" "$delim" >> "$GITHUB_ENV"
          done
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - run: pnpm --filter app bundle
      - name: Collect the packages
        run: |
          mkdir packages
          find app/target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' \) -exec cp {} packages/ \;
          ls -l packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.os }}
          path: packages/*
          if-no-files-found: error
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache.outputs.cache-primary-key }}

  release:
    name: GitHub release
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Checksums of the packages
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      # the notes name the extension version in the repo at the tag, before the generated list of changes
      - name: Create the release with every package
        run: |
          extension="$(node -p "require('./extension/manifest.json').version")"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Onay $GITHUB_REF_NAME" \
            --notes "Works with version $extension of the Onay browser extension." --generate-notes release/*

  site:
    name: Rebuild onay.sh
    needs: release
    runs-on: ubuntu-latest
    # the hook URL is a secret of the release environment, so only version tags reach it
    environment: release
    steps:
      # Cloudflare Pages builds main, which holds the tag, and reads the new release from the GitHub API
      - name: Start the Cloudflare Pages build
        env:
          HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error -X POST "$HOOK"
