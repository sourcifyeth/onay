# Builds and publishes a release from a version tag on main, such as 0.1.0.
# The tag must equal the app version in the repo (scripts/set-version.mjs).
# The app is published only from here. The extension still goes to the
# Chrome Web Store by hand (README).
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Tag on main, version in the repo
    runs-on: ubuntu-latest
    steps:
      # actions are pinned to commit SHAs (tag in the comment), per the supply-chain rules
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: The tag equals the version in the repo
        run: node scripts/set-version.mjs --check app "$GITHUB_REF_NAME"

  app:
    name: App on ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # one native runner per target: Linux x64, macOS arm64
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # the registry cache of the CI workflow; release builds save none
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('app/Cargo.lock', 'app/rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # macOS: with the secrets, Tauri imports the Developer ID certificate into
      # a keychain of its own, signs, and notarizes. Without them the app gets
      # an ad-hoc signature (tauri.bundle.conf.json). Empty variables would
      # break the bundler, so only the set ones reach the environment.
      - name: Apple signing credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No certificate: ad-hoc signature."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            printf '%s<<EOF\n%s\nEOF\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
            for name in APPLE_API_ISSUER APPLE_API_KEY; do
              printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
            done
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi
      - run: pnpm --filter app bundle
      - name: Collect the packages
        run: |
          mkdir packages
          find app/target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' \) -exec cp {} packages/ \;
          ls -l packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.os }}
          path: packages/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - run: ls -l release
      - name: Create the release with every package
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Onay $GITHUB_REF_NAME" --generate-notes release/*
