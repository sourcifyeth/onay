# Builds, lints, and tests every package on each pull request and push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript (mock, app webview, extension)
    runs-on: ubuntu-latest
    steps:
      # actions are pinned to commit SHAs (tag in the comment), per the supply-chain rules
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # the frozen-lockfile guardrail: lockfile drift fails here
      - run: pnpm install --frozen-lockfile
      # formatting (oxfmt) is checked, never changed, in CI
      - run: pnpm format:check
      # the site build reads the releases from the GitHub API; the token lifts the limit of shared runners
      - run: pnpm -r build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm -r lint
      - run: pnpm -r test
      # the scripts of the repo root
      - run: pnpm test

  rust:
    name: Rust on ${{ matrix.os }} (app, relay)
    strategy:
      fail-fast: false
      matrix:
        # the peer check on macOS calls the kernel and the Security framework, so its tests need a Mac
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    env:
      # smaller build caches: no incremental build data, and line tables as the only debug info
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the toolchain comes from app/rust-toolchain.toml; rustup on the runner installs it on first use
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      # pull requests restore the cache of main but save none: all caches of the repo share 10 GB
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/target
          key: cargo-${{ runner.os }}-${{ hashFiles('app/Cargo.lock', 'app/rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      # formatting is the same on every system
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - id: build
        run: cargo build --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      # main saves the cache once the build passed, also when a later check fails
      - if: ${{ !cancelled() && steps.build.outcome == 'success' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
