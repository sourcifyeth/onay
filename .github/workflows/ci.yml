# Builds, lints, and tests every package on each pull request and push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript (mock, app webview, extension)
    runs-on: ubuntu-latest
    steps:
      # actions are pinned to commit SHAs (tag in the comment), per the supply-chain rules
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # the frozen-lockfile guardrail: lockfile drift fails here
      - run: pnpm install --frozen-lockfile
      # formatting (oxfmt) is checked, never changed, in CI
      - run: pnpm format:check
      - run: pnpm -r build
      - run: pnpm -r lint
      - run: pnpm -r test

  rust:
    name: Rust (app, relay)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the toolchain comes from app/rust-toolchain.toml; rustup on the runner installs it on first use
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/target
          key: cargo-${{ runner.os }}-${{ hashFiles('app/Cargo.lock', 'app/rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo build --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
