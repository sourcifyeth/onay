# Drives the real app over WebDriver through the transactions in app/e2e/. It
# reads Ethereum mainnet, Sourcify, and the ERC-7730 registry, so it runs
# on a schedule and on request, not on every push.
name: E2E

on:
  workflow_dispatch:
  schedule:
    # Mondays at 06:00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end on Linux
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # empty when the secret is not set: the test then uses its default endpoint
      ONAY_E2E_RPC: ${{ secrets.E2E_RPC }}
    steps:
      # actions are pinned to commit SHAs (tag in the comment), per the supply-chain rules
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri Linux prerequisites, WebKitWebDriver, and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev webkit2gtk-driver xvfb
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the cache of main, read only: the CI workflow saves it
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/target
          key: cargo-${{ runner.os }}-${{ hashFiles('app/Cargo.lock', 'app/rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo install tauri-driver --locked --version 2.1.0
      - run: pnpm --filter app build:e2e
      - run: xvfb-run -a pnpm --filter app test:e2e
