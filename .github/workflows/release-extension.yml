# Builds the extension from a tag such as extension-0.1.1 on main, sends it to
# the Chrome Web Store for review, and keeps the zip on a GitHub release, so
# that a store submission is diffable against its commit. The tag must equal
# the extension version in the repo (scripts/set-version.mjs). The store
# credentials live in the `store` environment, which only extension tags may
# use, and there is no manual trigger: no workflow on a branch can reach them.
name: Release extension

on:
  push:
    tags: ['extension-[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Tag on main, version in the repo
    runs-on: ubuntu-latest
    steps:
      # actions are pinned to commit SHAs (tag in the comment), per the supply-chain rules
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: The tag equals the version in the repo
        run: node scripts/set-version.mjs --check extension "${GITHUB_REF_NAME#extension-}"

  package:
    name: Store zip
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter extension test
      # the commit time as the file time: the same zip on every build of this commit (README)
      - name: Build the reproducible zip
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" pnpm --filter extension package
          cd extension
          sha256sum onay-extension.zip | tee SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: |
            extension/onay-extension.zip
            extension/SHA256SUMS
          if-no-files-found: error

  store:
    name: Chrome Web Store
    needs: package
    runs-on: ubuntu-latest
    # the credentials of the environment, released to extension tags only
    environment: store
    env:
      ITEM: publishers/${{ secrets.CWS_PUBLISHER_ID }}/items/iobfgkmfcccohihielbadfbebklmbdbp
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension
      # an access token for one hour, from the refresh token of the account that owns the item
      - name: Access token
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          for name in CLIENT_ID CLIENT_SECRET REFRESH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret CWS_$name is not set in the store environment."
              exit 1
            fi
          done
          token="$(curl --fail --silent --show-error https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET" \
            --data-urlencode "refresh_token=$REFRESH_TOKEN" \
            --data-urlencode grant_type=refresh_token | jq -r .access_token)"
          if [ -z "$token" ] || [ "$token" = null ]; then
            echo "::error::No access token in the answer of the token endpoint."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "TOKEN=$token" >> "$GITHUB_ENV"
      # the store processes the package in the background: poll until it is done
      - name: Upload the package
        run: |
          answer="$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $TOKEN" -T onay-extension.zip \
            "https://chromewebstore.googleapis.com/upload/v2/$ITEM:upload")"
          echo "$answer"
          state="$(echo "$answer" | jq -r .uploadState)"
          for i in $(seq 1 60); do
            case "$state" in
              SUCCEEDED) break ;;
              IN_PROGRESS | UPLOAD_IN_PROGRESS) ;;
              *) echo "::error::Upload state $state."; exit 1 ;;
            esac
            sleep 10
            state="$(curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" \
              "https://chromewebstore.googleapis.com/v2/$ITEM:fetchStatus" | jq -r .lastAsyncUploadState)"
            echo "$state"
          done
          if [ "$state" != SUCCEEDED ]; then
            echo "::error::The store did not accept the package in ten minutes: $state."
            exit 1
          fi
      # the review takes days; the item goes live when it passes, with the visibility set in the dashboard
      - name: Submit for review
        run: |
          answer="$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' \
            "https://chromewebstore.googleapis.com/v2/$ITEM:publish")"
          echo "$answer"
          state="$(echo "$answer" | jq -r .state)"
          case "$state" in
            PENDING_REVIEW | PUBLISHED | STAGED) echo "Submitted: $state." ;;
            *) echo "::error::Submission state $state."; exit 1 ;;
          esac

  release:
    name: GitHub release
    needs: store
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension
      - name: Create the release with the zip that went to the store
        run: |
          version="${GITHUB_REF_NAME#extension-}"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Onay extension $version" \
            --notes "The zip submitted to the Chrome Web Store, reproducible from this commit (README)." \
            onay-extension.zip SHA256SUMS
