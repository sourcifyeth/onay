# Helios 0.12.1. Review these at every Helios bump.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0258"
reason = "h2 0.3, via helios-core > jsonrpsee 0.19; only Helios's JSON-RPC server uses it, and the app never starts that server"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0118"
reason = "hickory-proto 0.25, via helios > reqwest 0.12; affects DNSSEC validation, which is not enabled; fixed in 0.26, which reqwest 0.12 does not accept"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0119"
reason = "hickory-proto 0.25, via helios > reqwest 0.12; the resolver encodes only its own small queries; fixed in 0.26, which reqwest 0.12 does not accept"

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
reason = "unmaintained paste, a compile-time macro, via helios > alloy-primitives"

[[IgnoredVulns]]
id = "GHSA-5j98-2g5x-46v6"
reason = "hickory-resolver 0.25, via helios > reqwest 0.12; hides DNSSEC validation failures, and DNSSEC validation is not enabled; fixed in 0.26, which reqwest 0.12 does not accept"

[[IgnoredVulns]]
id = "GHSA-6f2x-v7q7-m7m5"
reason = "hickory-resolver 0.25, via helios > reqwest 0.12; sends extra queries for unrelated CNAME records, only to the system resolver; fixed in 0.26, which reqwest 0.12 does not accept"

[[IgnoredVulns]]
id = "RUSTSEC-2024-0388"
reason = "unmaintained derivative, in the lockfile only: ark-ff 0.3 and 0.4 use it, and they are optional dependencies of ruint (via helios > alloy-primitives) that are not built"

[[IgnoredVulns]]
id = "RUSTSEC-2024-0449"
reason = "unmaintained unsafe-libyaml, via helios-ethereum > serde_yaml; parses the checkpoint service list that Helios fetches from GitHub over HTTPS"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
reason = "crypto-bigint 0.5, via helios > alloy-signer > elliptic-curve 0.13; timing leaks on secret integers, and Onay holds no keys: the curve code only verifies signatures on public data; fixed in 0.7, which elliptic-curve 0.13 does not accept"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
reason = "unmaintained chrono, via helios-ethereum; no known vulnerability; waits for Helios to move"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0441"
reason = "unmaintained pin-utils, in the lockfile only: wasmtimer and zduny-wasm-timer use it, and they build only for wasm32, which Onay does not ship"

# hickory 0.25, via helios > reqwest 0.12 (feature hickory-dns). All are fixed
# in 0.26.2, which reqwest 0.12 does not accept. Helios 0.12.1 is the newest
# release and still uses reqwest 0.12. Remove these when Helios moves to reqwest 0.13.
# The build has only the features std, tokio and futures-io of hickory-proto:
# no DNSSEC validation and no text (zone file) parser. RUSTSEC-2026-0514
# (hickory-resolver DNSSEC lookup) is an alias of GHSA-5j98-2g5x-46v6 above.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0487"
reason = "hickory-proto 0.25: panic in the text parser of SVCB records; the text parser is not compiled (no text-parsing feature)"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0489"
reason = "hickory-proto 0.25: panic in the text parser of SVCB records; the text parser is not compiled (no text-parsing feature)"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0490"
reason = "hickory-proto 0.25: panic in the zone file lexer; the lexer is not compiled (no text-parsing feature)"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0491"
reason = "hickory-proto 0.25: a forged DNS reply makes the decoder reserve about 18 MB for each packet; only the system resolver or an attacker on the network path can send replies, and the worst result is that the app uses more memory or stops"

