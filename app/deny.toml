# cargo-deny configuration. Run `cargo deny check` in app/.
# Reference: https://embarkstudios.github.io/cargo-deny/checks/index.html

[graph]
# Check the targets we ship, not every target cargo knows about.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
all-features = true

[advisories]
# Source: the RustSec advisory database (default).
yanked = "deny"
# Each entry needs a reason. Review the list at every tauri bump.
ignore = [
  # gtk bindings (glib-macros 0.18) still use proc-macro-error. Fixed in glib 0.19+; waits for tauri to move.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained, via tauri > gtk > glib-macros; no upgrade path yet" },
  # tauri-utils > urlpattern 0.3 depends on the unmaintained unic-* family.
  { id = "RUSTSEC-2025-0075", reason = "unmaintained unic-char-range, via tauri-utils > urlpattern" },
  { id = "RUSTSEC-2025-0080", reason = "unmaintained unic-common, via tauri-utils > urlpattern" },
  { id = "RUSTSEC-2025-0081", reason = "unmaintained unic-char-property, via tauri-utils > urlpattern" },
  { id = "RUSTSEC-2025-0098", reason = "unmaintained unic-ucd-version, via tauri-utils > urlpattern" },
  { id = "RUSTSEC-2025-0100", reason = "unmaintained unic-ucd-ident, via tauri-utils > urlpattern" },
]

[licenses]
# Permissive licenses plus MPL-2.0 (weak copyleft, file-scoped). No GPL family.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# Our own crates are publish = false and have no license field.
ignore = true

[bans]
multiple-versions = "warn"
# Our manifests must pin versions; "*" is never acceptable.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
