# cargo-deny configuration. Run `cargo deny check` in app/.
# Reference: https://embarkstudios.github.io/cargo-deny/checks/index.html

[graph]
# Check the targets we ship, not every target cargo knows about.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin"]
all-features = true

[advisories]
# Source: the RustSec advisory database (default).
yanked = "deny"
# Each entry needs a reason. Review the list at every tauri bump.
ignore = [
  # gtk bindings (glib-macros 0.18) still use proc-macro-error. Fixed in glib 0.19+; waits for tauri to move.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained, via tauri > gtk > glib-macros; no upgrade path yet" },
  # tauri-utils > urlpattern 0.3 depends on the unmaintained unic-* family.
  { id = "RUSTSEC-2025-0075", reason = "unmaintained unic-char-range, via tauri-utils > urlpattern" },
  { id = "RUSTSEC-2025-0080", reason = "unmaintained unic-common, via tauri-utils > urlpattern" },
  { id = "RUSTSEC-2025-0081", reason = "unmaintained unic-char-property, via tauri-utils > urlpattern" },
  { id = "RUSTSEC-2025-0098", reason = "unmaintained unic-ucd-version, via tauri-utils > urlpattern" },
  { id = "RUSTSEC-2025-0100", reason = "unmaintained unic-ucd-ident, via tauri-utils > urlpattern" },
  # Helios 0.12.0. Review the list at every Helios bump.
  { id = "RUSTSEC-2026-0258", reason = "h2 0.3, via helios-core > jsonrpsee 0.19; only Helios's JSON-RPC server uses it, and the app never starts that server" },
  { id = "RUSTSEC-2026-0118", reason = "hickory-proto 0.25, via helios > reqwest 0.12; affects DNSSEC validation, which is not enabled; fixed in 0.26, which reqwest 0.12 does not accept" },
  { id = "RUSTSEC-2026-0119", reason = "hickory-proto 0.25, via helios > reqwest 0.12; the resolver encodes only its own small queries; fixed in 0.26, which reqwest 0.12 does not accept" },
  { id = "RUSTSEC-2024-0436", reason = "unmaintained paste, a compile-time macro, via helios > alloy-primitives" },
]

[licenses]
# Permissive licenses plus MPL-2.0 (weak copyleft, file-scoped). No GPL family.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  # A public domain dedication. Via helios > revm-precompile > aurora-engine-modexp.
  "CC0-1.0",
]
confidence-threshold = 0.9

# The Helios crates name no license in their manifests. The repository's
# LICENSE file is MIT.
[[licenses.clarify]]
crate = "helios-common"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "helios-consensus-core"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "helios-core"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "helios-ethereum"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "helios-revm-utils"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "helios-verifiable-api-client"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "helios-verifiable-api-types"
expression = "MIT"
license-files = []

[licenses.private]
# Our own crates are GPL-3.0-only and not published. The allowlist is for dependencies.
ignore = true

[bans]
multiple-versions = "warn"
# Our manifests must pin versions; "*" is never acceptable.
wildcards = "deny"
# Path dependencies inside this workspace carry no version on purpose.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Helios is not on crates.io. Cargo.toml pins it to the commit of a release tag.
allow-git = ["https://github.com/a16z/helios"]
