# cargo-deny configuration. Run `cargo deny check` in app/.
# Reference: https://embarkstudios.github.io/cargo-deny/checks/index.html

[graph]
# Check the targets we ship, not every target cargo knows about.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin"]
all-features = true

[advisories]
# Source: the RustSec advisory database (default).
yanked = "deny"
# Each entry needs a reason. Review the list at every tauri bump.
ignore = [
  # gtk bindings (glib-macros 0.18) still use proc-macro-error. Fixed in glib 0.19+; waits for tauri to move.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained, via tauri > gtk > glib-macros; no upgrade path yet" },
  # tauri-utils > urlpattern 0.3 depends on the unmaintained unic-* family.
  { id = "RUSTSEC-2025-0075", reason = "unmaintained unic-char-range, via tauri-utils > urlpattern" },
  { id = "RUSTSEC-2025-0080", reason = "unmaintained unic-common, via tauri-utils > urlpattern" },
  { id = "RUSTSEC-2025-0081", reason = "unmaintained unic-char-property, via tauri-utils > urlpattern" },
  { id = "RUSTSEC-2025-0098", reason = "unmaintained unic-ucd-version, via tauri-utils > urlpattern" },
  { id = "RUSTSEC-2025-0100", reason = "unmaintained unic-ucd-ident, via tauri-utils > urlpattern" },
  # Helios 0.12.1. Review the list at every Helios bump.
  { id = "RUSTSEC-2026-0258", reason = "h2 0.3, via helios-core > jsonrpsee 0.19; only Helios's JSON-RPC server uses it, and the app never starts that server" },
  { id = "RUSTSEC-2026-0118", reason = "hickory-proto 0.25, via helios > reqwest 0.12; affects DNSSEC validation, which is not enabled; fixed in 0.26, which reqwest 0.12 does not accept" },
  { id = "RUSTSEC-2026-0119", reason = "hickory-proto 0.25, via helios > reqwest 0.12; the resolver encodes only its own small queries; fixed in 0.26, which reqwest 0.12 does not accept" },
  { id = "RUSTSEC-2024-0436", reason = "unmaintained paste, a compile-time macro, via helios > alloy-primitives" },
  { id = "RUSTSEC-2024-0449", reason = "unmaintained unsafe-libyaml, via helios-ethereum > serde_yaml; parses the checkpoint service list that Helios fetches from GitHub over HTTPS" },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5, via helios > alloy-signer > elliptic-curve 0.13; timing leaks on secret integers, and Onay holds no keys: the curve code only verifies signatures on public data; fixed in 0.7, which elliptic-curve 0.13 does not accept" },
  { id = "RUSTSEC-2026-0543", reason = "unmaintained chrono, via helios-ethereum; no known vulnerability; waits for Helios to move" },
  # hickory 0.25, via helios > reqwest 0.12 (feature hickory-dns). All are fixed
  # in 0.26.2, which reqwest 0.12 does not accept. Helios 0.12.1 is the newest
  # release and still uses reqwest 0.12. Remove these when Helios moves to reqwest 0.13.
  # The build has only the features std, tokio and futures-io of hickory-proto:
  # no DNSSEC validation and no text (zone file) parser.
  { id = "RUSTSEC-2026-0487", reason = "hickory-proto 0.25: panic in the text parser of SVCB records; the text parser is not compiled (no text-parsing feature)" },
  { id = "RUSTSEC-2026-0489", reason = "hickory-proto 0.25: panic in the text parser of SVCB records; the text parser is not compiled (no text-parsing feature)" },
  { id = "RUSTSEC-2026-0490", reason = "hickory-proto 0.25: panic in the zone file lexer; the lexer is not compiled (no text-parsing feature)" },
  { id = "RUSTSEC-2026-0491", reason = "hickory-proto 0.25: a forged DNS reply makes the decoder reserve about 18 MB for each packet; only the system resolver or an attacker on the network path can send replies, and the worst result is that the app uses more memory or stops" },
  { id = "RUSTSEC-2026-0504", reason = "hickory-proto 0.25: DNSSEC validation, which is not compiled (neither dnssec-ring nor dnssec-aws-lc-rs is on)" },
  { id = "RUSTSEC-2026-0505", reason = "hickory-proto 0.25: DNSSEC validation, which is not compiled (neither dnssec-ring nor dnssec-aws-lc-rs is on)" },
  { id = "RUSTSEC-2026-0511", reason = "hickory-proto 0.25: DNSSEC validation, which is not compiled (neither dnssec-ring nor dnssec-aws-lc-rs is on)" },
  { id = "RUSTSEC-2026-0512", reason = "hickory-proto 0.25: DNSSEC validation, which is not compiled (neither dnssec-ring nor dnssec-aws-lc-rs is on)" },
  { id = "RUSTSEC-2026-0514", reason = "hickory-resolver 0.25: DNSSEC validation, which is not compiled (neither dnssec-ring nor dnssec-aws-lc-rs is on)" },
  { id = "RUSTSEC-2026-0530", reason = "hickory-proto 0.25: DNSSEC validation, which is not compiled (neither dnssec-ring nor dnssec-aws-lc-rs is on)" },
  { id = "RUSTSEC-2026-0531", reason = "hickory-proto 0.25: DNSSEC validation, which is not compiled (neither dnssec-ring nor dnssec-aws-lc-rs is on)" },
  { id = "RUSTSEC-2026-0532", reason = "hickory-proto 0.25: DNSSEC validation, which is not compiled (neither dnssec-ring nor dnssec-aws-lc-rs is on)" },
  { id = "RUSTSEC-2026-0549", reason = "hickory-proto 0.25: DNSSEC validation, which is not compiled (neither dnssec-ring nor dnssec-aws-lc-rs is on)" },
  { id = "RUSTSEC-2026-0550", reason = "hickory-proto 0.25: DNSSEC validation, which is not compiled (neither dnssec-ring nor dnssec-aws-lc-rs is on)" },
  { id = "RUSTSEC-2026-0551", reason = "hickory-proto 0.25: DNSSEC validation, which is not compiled (neither dnssec-ring nor dnssec-aws-lc-rs is on)" },
]

[licenses]
# Permissive licenses plus MPL-2.0 (weak copyleft, file-scoped). No GPL family.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  # A public domain dedication. Via helios > revm-precompile > aurora-engine-modexp.
  "CC0-1.0",
]
confidence-threshold = 0.9

# The Helios crates name no license in their manifests. The repository's
# LICENSE file is MIT.
[[licenses.clarify]]
crate = "helios-common"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "helios-consensus-core"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "helios-core"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "helios-ethereum"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "helios-revm-utils"
expression = "MIT"
license-files = []

[licenses.private]
# Our own crates are GPL-3.0-only and not published. The allowlist is for dependencies.
ignore = true

[bans]
multiple-versions = "warn"
# Our manifests must pin versions; "*" is never acceptable.
wildcards = "deny"
# Path dependencies inside this workspace carry no version on purpose.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Helios is not on crates.io. Cargo.toml pins it to the commit of a release tag.
allow-git = ["https://github.com/a16z/helios"]
