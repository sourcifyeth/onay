[package]
name = "onay"
description = "Onay, the local signing companion: the desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
# The tauri-* companion crates are pinned in Cargo.lock to the versions that
# shipped with this tauri release. Newer ones break the build. After a tauri
# bump, run `cargo update --precise` for each of them, in dependency order.
tauri = { version = "=2.11.6", features = [] }
# serde and serde_json are already in tauri's tree; same versions as Cargo.lock.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
onay-ipc = { path = "../ipc" }
# The encrypted channel to the extension: X25519, HKDF-SHA-256, AES-256-GCM.
x25519-dalek = { version = "=3.0.0", features = ["static_secrets"] }
hkdf = "=0.13.0"
sha2 = "=0.11.0"
aes-gcm = "=0.11.1"
getrandom = "=0.4.3"
base64 = "=0.22.1"
# The Helios light client. It is not on crates.io: pinned to tag 0.12.0.
helios-ethereum = { git = "https://github.com/a16z/helios", rev = "2af9b41887e069144ee56cd710f3ddca195473f8" }
# Types of the Helios API. Same version as in Helios's tree.
alloy = { version = "=2.1.0", default-features = false, features = ["eips", "rpc-types-eth"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Peer credentials of the socket (SO_PEERCRED). Already in tauri's tree.
libc = "=0.2.189"
